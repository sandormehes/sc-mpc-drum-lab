name: Cross-platform verification

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install SuperCollider (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes supercollider-language supercollider-server
      - name: Install SuperCollider (macOS)
        if: runner.os == 'macOS'
        run: brew install supercollider
      - name: Run language smoke test
        run: ./scripts/test.sh tests/smoke.scd
      - name: Run offline render smoke test
        run: ./scripts/test.sh tests/render_smoke.scd

  pattern-library-contract:
    name: Pattern Library kit contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sandormehes/drum-pattern-library
          path: pattern-library
      - name: Validate published-kit manifest contract
        run: |
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises'
          import path from 'node:path'
          const root = 'pattern-library/supplemental-ui/audio/drumlab-kit'
          const manifest = JSON.parse(await readFile(path.join(root, 'manifest.json'), 'utf8'))
          for (const role of ['kick', 'snare', 'hat', 'perc']) {
            const files = Array.isArray(manifest.samples?.[role]) ? manifest.samples[role] : [manifest.samples?.[role]]
            if (!files.length || files.some((file) => typeof file !== 'string')) throw new Error(`Missing ${role}`)
            for (const file of files) await stat(path.join(root, file))
          }
          NODE
